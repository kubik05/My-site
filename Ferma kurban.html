<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emoji Farm</title>

<style>
body{
    margin:0;
    background:#7bc96f;
    font-family:Arial;
    overflow:hidden;
    color:white;
}

#topbar{
    background:#2f5e2f;
    padding:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 10px rgba(0,0,0,0.4);
}

#game{
    display:flex;
    height:calc(100vh - 70px);
}

#left{
    width:280px;
    background:#356b35;
    overflow-y:auto;
    padding:10px;
    box-sizing:border-box;
}

#farm{
    flex:1;
    position:relative;
    background:#89d37d;
}

.section{
    margin-bottom:18px;
    background:rgba(0,0,0,0.2);
    padding:10px;
    border-radius:12px;
}

button{
    margin:3px;
    border:none;
    border-radius:8px;
    padding:8px;
    cursor:pointer;
    font-weight:bold;
}

.seedBtn{
    width:100%;
}

.plot{
    position:absolute;
    width:90px;
    height:90px;
    background:#8b5a2b;
    border:4px solid #5b3816;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    cursor:pointer;
    transition:0.2s;
}

.plot:hover{
    transform:scale(1.05);
}

.treeSpot{
    position:absolute;
    width:100px;
    height:100px;
    border-radius:50%;
    background:#5ea84f;
    border:3px dashed rgba(255,255,255,0.4);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:50px;
    cursor:pointer;
}

#message{
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.6);
    padding:10px 20px;
    border-radius:12px;
    font-size:18px;
}

</style>
</head>
<body>

<div id="topbar">
    <div>🌾 Emoji Farm Deluxe</div>
    <div>
        💰 <span id="coins">120</span>
        | ⭐ Уровень <span id="level">1</span>
        | XP <span id="xp">0</span>
    </div>
</div>

<div id="game">

    <div id="left">

        <div class="section">
            <h3>🌱 Семена</h3>
            <div id="seedButtons"></div>
        </div>

        <div class="section">
            <h3>🌳 Деревья</h3>
            <button onclick="selectTree('🍎')">🍎 Яблоня - 50</button>
            <button onclick="selectTree('🥥')">🥥 Кокос - 90</button>
            <button onclick="selectTree('🍋')">🍋 Лимон - 120</button>
        </div>

        <div class="section">
            <h3>🎒 Инвентарь</h3>
            <div id="inventory"></div>
        </div>

        <div class="section">
            <h3>🏆 Награды</h3>
            <div id="quests"></div>
        </div>

    </div>

    <div id="farm">

        <!-- 10 грядок -->
        <div class="plot" data-id="0" style="left:80px;top:70px;"></div>
        <div class="plot" data-id="1" style="left:200px;top:70px;"></div>
        <div class="plot" data-id="2" style="left:320px;top:70px;"></div>
        <div class="plot" data-id="3" style="left:440px;top:70px;"></div>
        <div class="plot" data-id="4" style="left:560px;top:70px;"></div>

        <div class="plot" data-id="5" style="left:80px;top:210px;"></div>
        <div class="plot" data-id="6" style="left:200px;top:210px;"></div>
        <div class="plot" data-id="7" style="left:320px;top:210px;"></div>
        <div class="plot" data-id="8" style="left:440px;top:210px;"></div>
        <div class="plot" data-id="9" style="left:560px;top:210px;"></div>

        <!-- места для деревьев -->
        <div class="treeSpot" data-tree="0" style="right:180px;bottom:130px;"></div>
        <div class="treeSpot" data-tree="1" style="right:50px;bottom:240px;"></div>
        <div class="treeSpot" data-tree="2" style="right:310px;bottom:40px;"></div>

        <div id="message">Добро пожаловать на ферму 🌾</div>

    </div>
</div>

<script>

let coins = 120;
let level = 1;
let xp = 0;

let selectedSeed = null;
let selectedTree = null;

const inventory = {};

const seeds = [
{emoji:"🥕",name:"Морковь",buy:5,sell:12,grow:[5,10,15]},
{emoji:"🌽",name:"Кукуруза",buy:8,sell:18,grow:[8,15,20]},
{emoji:"🍅",name:"Томат",buy:10,sell:25,grow:[10,20,30]},
{emoji:"🍓",name:"Клубника",buy:15,sell:35,grow:[15,25,40]},
{emoji:"🥔",name:"Картофель",buy:7,sell:17,grow:[8,14,20]},
{emoji:"🍆",name:"Баклажан",buy:12,sell:30,grow:[14,22,35]},
{emoji:"🌶️",name:"Перец",buy:16,sell:38,grow:[15,28,40]},
{emoji:"🍉",name:"Арбуз",buy:25,sell:70,grow:[20,40,60]},
{emoji:"🎃",name:"Тыква",buy:30,sell:90,grow:[25,45,70]},
{emoji:"🥦",name:"Брокколи",buy:18,sell:42,grow:[16,28,44]}
];

const quests = [
    {need:100,reward:50,text:"Заработай 100 монет"},
    {need:300,reward:120,text:"Заработай 300 монет"},
    {need:700,reward:300,text:"Стань фермером профи"}
];

let totalEarned = 0;

function updateUI(){
    document.getElementById("coins").innerText = coins;
    document.getElementById("level").innerText = level;
    document.getElementById("xp").innerText = xp;

    let inv = "";
    for(let item in inventory){
        inv += item + " x" + inventory[item] + "<br>";
    }
    document.getElementById("inventory").innerHTML = inv || "Пусто";

    let q = "";
    quests.forEach(quest=>{
        let done = totalEarned >= quest.need;
        q += (done ? "✅ " : "⬜ ") + quest.text + 
        " | 🎁 +" + quest.reward + "<br>";

        if(done && !quest.claimed){
            quest.claimed = true;
            coins += quest.reward;
            show("Награда получена: +" + quest.reward + " 💰");
        }
    });

    document.getElementById("quests").innerHTML = q;
}

function show(text){
    document.getElementById("message").innerText = text;
}

function gainXP(amount){
    xp += amount;

    if(xp >= level * 100){
        xp = 0;
        level++;
        coins += level * 30;
        show("🎉 Новый уровень: " + level);
    }
}

function selectSeed(index){
    selectedSeed = seeds[index];
    selectedTree = null;
    show("Выбрано: " + selectedSeed.name);
}

function selectTree(tree){
    selectedTree = tree;
    selectedSeed = null;
    show("Выбрано дерево");
}

const seedButtons = document.getElementById("seedButtons");

seeds.forEach((s,index)=>{
    const btn = document.createElement("button");
    btn.className = "seedBtn";
    btn.innerText = `${s.emoji} ${s.name} - ${s.buy}`;
    btn.onclick = ()=>selectSeed(index);
    seedButtons.appendChild(btn);
});

document.querySelectorAll(".plot").forEach(plot=>{

    plot.state = "empty";

    plot.onclick = ()=>{

        if(plot.state === "empty" && selectedSeed){

            if(coins < selectedSeed.buy){
                show("Недостаточно монет");
                return;
            }

            coins -= selectedSeed.buy;
            updateUI();

            plot.crop = selectedSeed;
            plot.stage = 0;
            plot.state = "growing";

            plot.innerText = "🟤";

            growPlot(plot);
        }

        else if(plot.state === "ready"){

            plot.state = "empty";
            plot.innerText = "";

            coins += plot.crop.sell;
            totalEarned += plot.crop.sell;

            inventory[plot.crop.emoji] = 
            (inventory[plot.crop.emoji] || 0) + 1;

            gainXP(15);

            show("Продано за " + plot.crop.sell + " 💰");

            updateUI();
        }

    };

});

function growPlot(plot){

    const crop = plot.crop;

    setTimeout(()=>{
        plot.stage = 1;
        plot.innerText = "🌱";
    }, crop.grow[0] * 1000);

    setTimeout(()=>{
        plot.stage = 2;
        plot.innerText = "🌿";
    }, crop.grow[1] * 1000);

    setTimeout(()=>{
        plot.stage = 3;
        plot.innerText = crop.emoji;
        plot.state = "ready";
        show(crop.name + " созрел!");
    }, crop.grow[2] * 1000);

}

document.querySelectorAll(".treeSpot").forEach(spot=>{

    spot.state = "empty";

    spot.onclick = ()=>{

        if(spot.state === "empty" && selectedTree){

            let price = 50;

            if(selectedTree === "🥥") price = 90;
            if(selectedTree === "🍋") price = 120;

            if(coins < price){
                show("Не хватает монет");
                return;
            }

            coins -= price;
            updateUI();

            spot.state = "growing";
            spot.innerText = "🌱";

            setTimeout(()=>{
                spot.innerText = "🌿";
            },15000);

            setTimeout(()=>{
                spot.innerText = selectedTree;
                spot.state = "ready";
                show("Дерево выросло 🌳");
            },30000);

        }

        else if(spot.state === "ready"){

            let earn = Math.floor(Math.random()*40)+20;

            coins += earn;
            totalEarned += earn;

            gainXP(25);

            show("Собраны плоды +" + earn + " 💰");

            updateUI();
        }

    };

});

updateUI();

</script>

</body>
</html>
