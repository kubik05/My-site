<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инструменты</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .tool-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin: 20px;
            width: 80%;
            max-width: 400px;
        }
        input, select, button {
            padding: 10px;
            margin: 5px 0;
            border-radius: 10px;
            border: none;
            width: calc(100% - 20px);
        }
        button {
            background: #4CAF50;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .result {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
        }
        .back-link {
            margin-top: 30px;
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <h1>🧮 Инструменты</h1>

    <div class="tool-card">
        <h2>💰 Калькулятор зарплаты</h2>
        <label>Оклад в день (₽): <input type="number" id="salary" value="1500"></label>
        <label>Пиков в день: <input type="number" id="picks" value="700"></label>
        <label>Цена за пик (₽): <input type="number" id="pickPrice" value="4.8"></label>
        <label>Своих смен: <input type="number" id="ownShifts" value="16"></label>
        <label>Подработок (двойной оклад): <input type="number" id="extraShifts" value="7"></label>
        <button onclick="calcSalary()">Рассчитать</button>
        <div class="result" id="salaryResult"></div>
    </div>

    <div class="tool-card">
        <h2>💱 Конвертер валют</h2>
        <label>Сумма: <input type="number" id="amount" value="1"></label>
        <label>Из: <select id="from"><option value="USD">USD</option><option value="RUB">RUB</option></select></label>
        <label>В: <select id="to"><option value="RUB">RUB</option><option value="USD">USD</option></select></label>
        <button onclick="convertCurrency()">Конвертировать</button>
        <div class="result" id="convertResult"></div>
    </div>

    <a href="index.html" class="back-link">← На главную</a>

    <script>
        function calcSalary() {
            const salary = +document.getElementById('salary').value;
            const picks = +document.getElementById('picks').value;
            const pickPrice = +document.getElementById('pickPrice').value;
            const ownShifts = +document.getElementById('ownShifts').value;
            const extraShifts = +document.getElementById('extraShifts').value;
            const perDayOwn = salary + picks * pickPrice;
            const perDayExtra = salary * 2 + picks * pickPrice;
            const total = ownShifts * perDayOwn + extraShifts * perDayExtra;
            const afterTax = total * 0.87;
            document.getElementById('salaryResult').innerHTML = 
                `До налога: ${total.toFixed(0)} ₽<br>На руки (13%): ${afterTax.toFixed(0)} ₽`;
        }
        async function convertCurrency() {
            const amount = document.getElementById('amount').value;
            const from = document.getElementById('from').value;
            const to = document.getElementById('to').value;
            try {
                const resp = await fetch(`https://api.exchangerate-api.com/v4/latest/${from}`);
                const data = await resp.json();
                const rate = data.rates[to];
                const result = (amount * rate).toFixed(2);
                document.getElementById('convertResult').textContent = `${amount} ${from} = ${result} ${to}`;
            } catch(e) {
                document.getElementById('convertResult').textContent = 'Ошибка загрузки курса';
            }
        }
    </script>
</body>
</html>
