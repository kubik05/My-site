<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игры</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        a { color: #ffd700; }
        .game-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin: 20px;
            text-align: center;
            width: 80%;
            max-width: 400px;
        }
        button {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:active { transform: scale(0.95); }
        .back-link {
            margin-top: 30px;
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <h1>🎮 Игры</h1>
    
    <div class="game-card">
        <h2>🖱️ Кликер</h2>
        <p>Счёт: <span id="score">0</span></p>
        <button onclick="document.getElementById('score').textContent = parseInt(document.getElementById('score').textContent) + 1">ЖМИ!</button>
    </div>

    <div class="game-card">
        <h2>🌾 Ферма</h2>
        <p>как мущина нажми играть </p>
        <a href="farm.html" class="back-link">Играть в мущинскую ферму</a>
    </div>

    <a href="index.html" class="back-link">← На главную</a>
</body>
</html>
