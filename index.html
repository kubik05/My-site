<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Web OS</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b12;
  color:white;
}

/* ===== PHONE HOME ===== */
#home{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  padding:15px;
}

.icon{
  background:rgba(255,255,255,0.08);
  border-radius:18px;
  padding:20px 10px;
  text-align:center;
  font-size:14px;
  cursor:pointer;
  user-select:none;
}

/* ===== FULL APP SCREEN (mobile style) ===== */
#app{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#0f0f18;
  display:none;
  flex-direction:column;
}

.topbar{
  height:50px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  background:rgba(255,255,255,0.08);
}

.back{
  background:none;
  border:none;
  color:white;
  font-size:18px;
}

.content{
  flex:1;
  overflow:auto;
}

/* iframe full */
iframe{
  width:100%;
  height:100%;
  border:none;
}
</style>

</head>

<body>

<!-- ===== HOME ===== -->
<div id="home">

  <div class="icon" onclick="openChat()">💬<br>Чат</div>
  <div class="icon" onclick="openNotes()">📝<br>Заметки</div>
  <div class="icon" onclick="openGallery()">📷<br>Галерея</div>
  <div class="icon" onclick="openGames()">🎮<br>Игры</div>
  <div class="icon" onclick="openFarm()">🌾<br>Ферма</div>

</div>

<!-- ===== APP SCREEN ===== -->
<div id="app">
  <div class="topbar">
    <button class="back" onclick="closeApp()">←</button>
    <span id="title">App</span>
    <div></div>
  </div>
  <div class="content" id="content"></div>
</div>

<script>

/* =========================
   MOBILE NAVIGATION
========================= */

function openApp(title, html){
  document.getElementById("home").style.display="none";
  document.getElementById("app").style.display="flex";
  document.getElementById("title").innerText=title;
  document.getElementById("content").innerHTML=html;
}

function closeApp(){
  document.getElementById("home").style.display="grid";
  document.getElementById("app").style.display="none";
}

/* =========================
   APPS
========================= */

function openChat(){
  openApp("💬 Чат", `
    <input style="width:100%;padding:10px">
    <button>Отправить</button>
  `);
}

function openNotes(){
  openApp("📝 Заметки", `
    <textarea style="width:100%;height:300px"></textarea>
  `);
}

function openGallery(){
  openApp("📷 Галерея", `
    <input type="file">
  `);
}

function openGames(){
  openApp("🎮 Игры", `
    <p>Игры скоро будут</p>
  `);
}

/* =========================
   🌾 FARM (FULL SCREEN APP)
========================= */

function openFarm(){
  openApp("🌾 Ферма", `
    <iframe src="farm.html"></iframe>
  `);
}

</script>

</body>
</html>
