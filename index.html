<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Web OS</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b12;
  color:white;
  overflow:hidden;
}

/* HOME */
#home{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  padding:15px;
  transition:0.3s;
}

.icon{
  background:rgba(255,255,255,0.08);
  border-radius:18px;
  padding:20px 10px;
  text-align:center;
  font-size:14px;
  cursor:pointer;
  user-select:none;
}

/* BLUR */
.blur{
  filter:blur(6px);
  transform:scale(0.98);
}

/* WINDOWS */
.window{
  position:fixed;
  top:60px;
  left:10px;
  right:10px;
  bottom:80px;
  background:#111827;
  border-radius:16px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
  animation:pop .2s ease;
}

@keyframes pop{
  from{transform:scale(0.9);opacity:0;}
  to{transform:scale(1);opacity:1;}
}

.winbar{
  height:40px;
  background:rgba(255,255,255,0.08);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 10px;
}

.wincontent{
  flex:1;
  overflow:auto;
}

/* DOCK */
#dock{
  position:fixed;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(255,255,255,0.08);
  padding:10px 20px;
  border-radius:20px;
  display:flex;
  gap:20px;
}

/* NOTIF */
#notif{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.7);
  padding:10px 20px;
  border-radius:12px;
  display:none;
}
</style>

</head>

<body>

<!-- HOME -->
<div id="home">

  <div class="icon" onclick="openChat()">💬<br>Чат</div>
  <div class="icon" onclick="openNotes()">📝<br>Заметки</div>
  <div class="icon" onclick="openGallery()">📷<br>Галерея</div>
  <div class="icon" onclick="openGames()">🎮<br>Игры</div>
  <div class="icon" onclick="openFarm()">🌾<br>Ферма</div>

</div>

<!-- DOCK -->
<div id="dock">
  <div onclick="openChat()">💬</div>
  <div onclick="openFarm()">🌾</div>
  <div onclick="openGames()">🎮</div>
</div>

<!-- NOTIF -->
<div id="notif"></div>

<script>

/* =====================
   MULTI WINDOW SYSTEM
===================== */

let apps = {};
let zIndex = 10;

function openApp(title, html){

  let id = "app_" + Date.now();

  let win = document.createElement("div");
  win.className = "window";
  win.style.zIndex = zIndex++;

  win.innerHTML = `
    <div class="winbar">
      <span>${title}</span>
      <button onclick="closeWin('${id}')">✕</button>
    </div>
    <div class="wincontent">${html}</div>
  `;

  win.id = id;

  document.body.appendChild(win);

  apps[id] = win;

  document.getElementById("home").classList.add("blur");

}

function closeWin(id){

  if(apps[id]){
    apps[id].remove();
    delete apps[id];
  }

  if(Object.keys(apps).length === 0){
    document.getElementById("home").classList.remove("blur");
  }

}

/* =====================
   APPS
===================== */

function openChat(){
  openApp("💬 Чат", `<input style="width:100%;padding:10px"><button>Отправить</button>`);
}

function openNotes(){
  openApp("📝 Заметки", `<textarea style="width:100%;height:300px"></textarea>`);
}

function openGallery(){
  openApp("📷 Галерея", `<input type="file">`);
}

function openGames(){
  openApp("🎮 Игры", `<p>Игры скоро будут</p>`);
}

/* =====================
   FARM (FIXED PATH)
===================== */

function openFarm(){
  openApp("🌾 Ферма", `
    <iframe src="farm-game/index.html"></iframe>
  `);
}

/* =====================
   NOTIFICATION
===================== */

function notify(text){

  let n=document.getElementById("notif");
  n.innerText=text;
  n.style.display="block";

  setTimeout(()=>n.style.display="none",2000);

}

/* =====================
   SWIPE (IOS STYLE)
===================== */

let startY=0;

document.addEventListener("touchstart",e=>{
  startY=e.touches[0].clientY;
});

document.addEventListener("touchend",e=>{
  let endY=e.changedTouches[0].clientY;

  if(startY - endY > 80){
    minimizeAll();
  }
});

function minimizeAll(){

  for(let id in apps){
    apps[id].remove();
  }

  apps={};

  document.getElementById("home").classList.remove("blur");

}

</script>

</body>
</html>
