<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой телефон</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background: radial-gradient(circle at top, #0b0b14, #05050a);
  color:white;
  overflow:hidden;
}

/* ===== УВЕДОМЛЕНИЕ ===== */
#уведомление{
  position:absolute;
  top:20px;
  right:20px;
  background:rgba(255,255,255,0.08);
  padding:10px;
  border-radius:12px;
  display:none;
  backdrop-filter:blur(10px);
}

/* ===== ГЛАВНЫЙ ЭКРАН ===== */
.экран{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  padding:20px;
  height:100vh;
  align-content:start;
}

/* ===== ИКОНКИ ===== */
.иконка{
  background:rgba(255,255,255,0.06);
  border-radius:18px;
  height:90px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  user-select:none;
}

.иконка:hover{
  transform:scale(1.05);
}

/* ===== ПРИЛОЖЕНИЕ (ПОЛНЫЙ ЭКРАН) ===== */
.app{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(10,10,20,0.98);
  display:none;
  flex-direction:column;
  z-index:999;
  padding:15px;
}

/* ===== КНОПКА НАЗАД ===== */
.back{
  padding:10px;
  margin-bottom:10px;
  background:linear-gradient(135deg,#5c6cff,#4fd1c5);
  border:none;
  border-radius:10px;
  color:white;
}

/* ===== ПОЛЯ ===== */
input{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:#111;
  border:1px solid #333;
  border-radius:8px;
  color:white;
}

button{
  margin-top:10px;
  padding:10px;
  background:linear-gradient(135deg,#5c6cff,#4fd1c5);
  border:none;
  border-radius:10px;
  color:white;
}

/* ===== ГАЛЕРЕЯ ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  margin-top:10px;
}

img{
  width:100%;
  border-radius:8px;
}
</style>
</head>

<body>

<div id="уведомление">📢</div>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="дом" class="экран">

  <div class="иконка" onclick="открыть('галерея')">📷<br>Галерея</div>
  <div class="иконка" onclick="открыть('чат')">💬<br>Чат</div>
  <div class="иконка" onclick="открыть('заметки')">📝<br>Заметки</div>
  <div class="иконка" onclick="открыть('погода')">🌦<br>Погода</div>

</div>

<!-- ПРИЛОЖЕНИЕ -->
<div id="app" class="app"></div>

<script>

let текущее="дом";

/* ===== УВЕДОМЛЕНИЯ ===== */
function уведомить(t){
  const n=document.getElementById("уведомление");
  n.innerText="📢 "+t;
  n.style.display="block";
  setTimeout(()=>n.style.display="none",2000);
}

/* ===== ОТКРЫТЬ ПРИЛОЖЕНИЕ ===== */
function открыть(тип){

  текущее=тип;

  document.getElementById("дом").style.display="none";

  const app=document.getElementById("app");
  app.style.display="flex";

  let c="";

  if(тип==="галерея"){
    c=`
      <button class="back" onclick="назад()">← Назад</button>
      📷 Галерея
      <input type="file" accept="image/*" onchange="загрузитьФото(event)">
      <div id="галерея" class="grid"></div>
    `;
    setTimeout(загрузитьГалерею,100);
  }

  if(тип==="чат"){
    c=`
      <button class="back" onclick="назад()">← Назад</button>
      💬 Чат
      <input id="сообщение">
      <button onclick="отправить()">Отправить</button>
    `;
  }

  if(тип==="заметки"){
    c=`
      <button class="back" onclick="назад()">← Назад</button>
      📝 Заметки
      <input id="заметка">
      <button onclick="добавить()">Добавить</button>
    `;
  }

  if(тип==="погода"){
    c=`
      <button class="back" onclick="назад()">← Назад</button>
      🌦 загрузка...
    `;
    погода();
  }

  app.innerHTML=c;

  уведомить("Открыто: "+тип);
}

/* ===== НАЗАД ===== */
function назад(){
  document.getElementById("app").style.display="none";
  document.getElementById("дом").style.display="grid";
}

/* ===== ПОГОДА ===== */
async function погода(){
  const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=50.11&longitude=8.68&current_weather=true");
  const d=await r.json();
  document.getElementById("app").innerHTML=`
    <button class="back" onclick="назад()">← Назад</button>
    🌦 Температура: ${d.current_weather.temperature}°C
  `;
}

/* ===== ЧАТ ===== */
function отправить(){
  let m=document.getElementById("сообщение");
  let c=JSON.parse(localStorage.getItem("чат")||"[]");
  c.push(m.value);
  localStorage.setItem("чат",JSON.stringify(c));
  m.value="";
}

/* ===== ЗАМЕТКИ ===== */
function добавить(){
  let z=document.getElementById("заметка");
  let a=JSON.parse(localStorage.getItem("заметки")||"[]");
  a.push(z.value);
  localStorage.setItem("заметки",JSON.stringify(a));
  z.value="";
}

/* ===== ГАЛЕРЕЯ ===== */
function загрузитьФото(e){
  const f=e.target.files[0];
  const r=new FileReader();

  r.onload=function(){
    let a=JSON.parse(localStorage.getItem("фото")||"[]");
    a.push(r.result);
    localStorage.setItem("фото",JSON.stringify(a));
    загрузитьГалерею();
  };

  r.readAsDataURL(f);
}

function загрузитьГалерею(){
  const g=document.getElementById("галерея");
  if(!g) return;

  let a=JSON.parse(localStorage.getItem("фото")||"[]");
  g.innerHTML="";

  a.forEach(img=>{
    let el=document.createElement("img");
    el.src=img;
    g.appendChild(el);
  });
}

</script>

</body>
</html>
