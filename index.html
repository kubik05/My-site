<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Web OS</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b12;
  color:white;
  overflow:hidden;
}

/* HOME */
#home{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  padding:15px;
}

.icon{
  background:rgba(255,255,255,0.08);
  border-radius:18px;
  padding:20px 10px;
  text-align:center;
  cursor:pointer;
}

/* BLUR */
.blur{
  filter:blur(6px);
  transform:scale(0.98);
}

/* DOCK */
#dock{
  position:fixed;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(255,255,255,0.08);
  padding:10px 20px;
  border-radius:20px;
  display:flex;
  gap:20px;
}

/* NOTIF */
#notif{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.7);
  padding:10px 20px;
  border-radius:12px;
  display:none;
  z-index:99999;
}

/* ===== FULLSCREEN FARM ===== */
#farmFull{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  flex-direction:column;
  z-index:9999;
}

#farmTop{
  height:50px;
  background:#111;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 10px;
  color:white;
}

#farmFull iframe{
  flex:1;
  width:100%;
  border:none;
}
</style>

</head>

<body>

<!-- HOME -->
<div id="home">

  <div class="icon" onclick="openChat()">💬<br>Чат</div>
  <div class="icon" onclick="openNotes()">📝<br>Заметки</div>
  <div class="icon" onclick="openGallery()">📷<br>Галерея</div>
  <div class="icon" onclick="openGames()">🎮<br>Игры</div>
  <div class="icon" onclick="openFarm()">🌾<br>Ферма</div>

</div>

<!-- DOCK -->
<div id="dock">
  <div onclick="openChat()">💬</div>
  <div onclick="openFarm()">🌾</div>
  <div onclick="openGames()">🎮</div>
</div>

<!-- NOTIF -->
<div id="notif"></div>

<script>

/* =====================
   APPS
===================== */

function openChat(){
  alert("чат");
}

function openNotes(){
  alert("notes");
}

function openGallery(){
  alert("gallery");
}

function openGames(){
  alert("games");
}

/* =====================
   🚀 FULLSCREEN FARM FIX
===================== */

function openFarm(){

  document.getElementById("home").classList.add("blur");

  document.body.insertAdjacentHTML("beforeend",`
    <div id="farmFull">
      <div id="farmTop">
        <button onclick="closeFarm()" style="font-size:20px;">←</button>
        <span>🌾 Ферма</span>
      </div>

      <iframe src="farm-game/index.html"></iframe>
    </div>
  `);

}

function closeFarm(){
  document.getElementById("farmFull").remove();
  document.getElementById("home").classList.remove("blur");
}

/* =====================
   NOTIFICATION
===================== */

function notify(text){

  let n=document.getElementById("notif");
  n.innerText=text;
  n.style.display="block";

  setTimeout(()=>n.style.display="none",2000);

}

</script>

</body>
</html>
