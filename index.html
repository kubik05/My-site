<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Моя система</title>

<style>
body{
  margin:0;
  font-family:Arial;
  overflow:hidden;
  color:white;

  background:
    radial-gradient(circle at 20% 20%, #6c5cff55, transparent 40%),
    radial-gradient(circle at 80% 30%, #00ffd055, transparent 40%),
    radial-gradient(circle at 50% 80%, #ff4fd855, transparent 50%),
    #0a0a12;
}

/* ===== ДОМ ===== */
#дом{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  padding:20px;
  height:100vh;
  align-content:start;
}

.иконка{
  background:rgba(255,255,255,0.06);
  border-radius:18px;
  height:90px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}

/* ===== APP ===== */
#app{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(10,10,20,0.98);
  display:none;
  flex-direction:column;
  padding:10px;
}

.back{
  padding:10px;
  background:linear-gradient(135deg,#5c6cff,#4fd1c5);
  border:none;
  border-radius:10px;
  color:white;
  margin-bottom:10px;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  background:#111;
  border:1px solid #333;
  color:white;
  border-radius:8px;
}

button{
  margin-top:8px;
  padding:10px;
  background:linear-gradient(135deg,#5c6cff,#4fd1c5);
  border:none;
  border-radius:10px;
  color:white;
}

.grid img{
  width:100%;
  border-radius:10px;
}

/* ===== РЕКОРДЫ ===== */
#рекорд{
  font-size:12px;
  opacity:0.7;
}
</style>
</head>

<body>

<div id="дом">
  <div class="иконка" onclick="открыть('галерея')">📷<br>Галерея</div>
  <div class="иконка" onclick="открыть('чат')">💬<br>Чат</div>
  <div class="иконка" onclick="открыть('заметки')">📝<br>Заметки</div>
  <div class="иконка" onclick="открыть('погода')">🌦<br>Погода</div>
  <div class="иконка" onclick="открыть('игры')">🎮<br>Игры</div>
</div>

<div id="app"></div>

<script>

/* ===== РЕКОРДЫ ===== */
let рекорды = JSON.parse(localStorage.getItem("рекорды")||"{}");

function сохранитьРекорд(игра,val){
  if(!рекорды[игра]||val>рекорды[игра]){
    рекорды[игра]=val;
    localStorage.setItem("рекорды",JSON.stringify(рекорды));
  }
}

/* ===== ЗВУК ===== */
function звук(f){
  let ctx=new AudioContext();
  let o=ctx.createOscillator();
  o.frequency.value=f;
  o.connect(ctx.destination);
  o.start();
  setTimeout(()=>o.stop(),100);
}

/* ===== ВИБРО ===== */
function вибро(){
  if(navigator.vibrate) navigator.vibrate(50);
}

/* ===== НАВИГАЦИЯ ===== */
function открыть(t){

  document.getElementById("дом").style.display="none";
  let app=document.getElementById("app");
  app.style.display="flex";

  let c="";

  if(t==="галерея"){
    c=`
      <button class="back" onclick="назад()">← Назад</button>
      📷 Галерея
      <input type="file" accept="image/*" onchange="загрузитьФото(event)">
      <div id="галерея" class="grid"></div>
    `;
    setTimeout(загрузитьГалерею,100);
  }

  if(t==="чат"){
    c=`
      <button class="back" onclick="назад()">← Назад</button>
      💬 Чат
      <div id="чат-вывод"></div>
      <input id="сообщение">
      <button onclick="отправить();загрузитьЧат()">Отправить</button>
    `;
    setTimeout(загрузитьЧат,100);
  }

  if(t==="заметки"){
    c=`
      <button class="back" onclick="назад()">← Назад</button>
      📝 Заметки
      <div id="заметки-вывод"></div>
      <input id="заметка">
      <button onclick="добавить();загрузитьЗаметки()">Добавить</button>
    `;
    setTimeout(загрузитьЗаметки,100);
  }

  if(t==="погода"){
    c=`<button class="back" onclick="назад()">← Назад</button> 🌦 загрузка...`;
    app.innerHTML=c;
    погода();
    return;
  }

  if(t==="игры"){
    c=`
      <button class="back" onclick="назад()">← Назад</button>

      🎮 Игры

      <h3>🎯 Тап</h3>
      <button onclick="тап()">Клик</button>
      <div id="score">0</div>

      <h3>🐍 Змейка</h3>
      <button onclick="змейка()">Старт</button>

      <h3>🧠 Память</h3>
      <button onclick="память()">Старт</button>
      <div id="игра"></div>

      <div id="рекорд"></div>
    `;
  }

  app.innerHTML=c;
}

/* ===== НАЗАД ===== */
function назад(){
  document.getElementById("app").style.display="none";
  document.getElementById("дом").style.display="grid";
  clearInterval(window.snakeInt);
}

/* ===== ПОГОДА ===== */
async function погода(){
  const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=50.11&longitude=8.68&current_weather=true");
  const d=await r.json();
  document.getElementById("app").innerHTML=`
    <button class="back" onclick="назад()">← Назад</button>
    🌦 ${d.current_weather.temperature}°C
  `;
}

/* ===== ЧАТ ===== */
function отправить(){
  let m=document.getElementById("сообщение");
  let c=JSON.parse(localStorage.getItem("чат")||"[]");
  c.push(m.value);
  localStorage.setItem("чат",JSON.stringify(c));
  m.value="";
}

function загрузитьЧат(){
  let b=document.getElementById("чат-вывод");
  if(!b) return;
  let c=JSON.parse(localStorage.getItem("чат")||"[]");
  b.innerHTML=c.map(x=>"💬 "+x).join("<br>");
}

/* ===== ЗАМЕТКИ ===== */
function добавить(){
  let z=document.getElementById("заметка");
  let a=JSON.parse(localStorage.getItem("заметки")||"[]");
  a.push(z.value);
  localStorage.setItem("заметки",JSON.stringify(a));
  z.value="";
}

function загрузитьЗаметки(){
  let b=document.getElementById("заметки-вывод");
  if(!b) return;
  let z=JSON.parse(localStorage.getItem("заметки")||"[]");
  b.innerHTML=z.map(x=>"📝 "+x).join("<br>");
}

/* ===== ГАЛЕРЕЯ ===== */
function загрузитьФото(e){
  let f=e.target.files[0];
  let r=new FileReader();

  r.onload=function(){
    let a=JSON.parse(localStorage.getItem("фото")||"[]");
    a.push(r.result);
    localStorage.setItem("фото",JSON.stringify(a));
    загрузитьГалерею();
  };

  r.readAsDataURL(f);
}

function загрузитьГалерею(){
  let g=document.getElementById("галерея");
  if(!g) return;
  let a=JSON.parse(localStorage.getItem("фото")||"[]");
  g.innerHTML="";
  a.forEach(i=>{
    let img=document.createElement("img");
    img.src=i;
    g.appendChild(img);
  });
}

/* ===== ИГРЫ ===== */
let score=0;

function тап(){
  score++;
  document.getElementById("score").innerText=score;
  звук(600);
  вибро();
  сохранитьРекорд("тап",score);
}

/* ===== ЗМЕЙКА ===== */
function змейка(){
  let c=document.getElementById("игра");
  c.innerHTML="<canvas id='cnv' width='300' height='300'></canvas>";

  let ctx=document.getElementById("cnv").getContext("2d");

  let snake=[{x:5,y:5}];
  let dir="right";

  window.snakeInt=setInterval(()=>{
    let h={...snake[0]};
    if(dir=="right")h.x++;
    if(dir=="left")h.x--;
    if(dir=="up")h.y--;
    if(dir=="down")h.y++;

    if(h.x<0||h.y<0||h.x>19||h.y>19){
      clearInterval(window.snakeInt);
      звук(200);
      return;
    }

    snake.unshift(h);
    snake.pop();

    ctx.fillStyle="#111";
    ctx.fillRect(0,0,300,300);

    ctx.fillStyle="lime";
    snake.forEach(s=>ctx.fillRect(s.x*15,s.y*15,15,15));

  },150);
}

/* ===== ПАМЯТЬ ===== */
function память(){
  let g=document.getElementById("игра");
  let n=[1,1,2,2,3,3,4,4].sort(()=>Math.random()-0.5);

  g.innerHTML="";
  n.forEach(x=>{
    let d=document.createElement("div");
    d.className="card";
    d.innerText="?";
    d.onclick=()=>d.innerText=x;
    g.appendChild(d);
  });
}

</script>

</body>
</html>
