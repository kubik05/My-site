<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My App OS</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f0f0f;
  color: white;
  overflow: hidden;
}

/* LAYOUT */
.app {
  display: flex;
  height: 100vh;
}

/* SIDEBAR (ANDROID) */
.sidebar {
  width: 70px;
  background: #181818;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 10px;
}

.sidebar button {
  background: none;
  border: none;
  color: white;
  font-size: 20px;
  padding: 14px;
  cursor: pointer;
}

.sidebar button:hover {
  background: #333;
  border-radius: 12px;
}

/* CONTENT */
.content {
  flex: 1;
  position: relative;
}

/* SCREENS */
.screen {
  position: absolute;
  width: 100%;
  height: 100%;
  padding: 20px;
  opacity: 0;
  transform: translateX(30px);
  transition: 0.25s ease;
  pointer-events: none;
}

.screen.active {
  opacity: 1;
  transform: translateX(0);
  pointer-events: auto;
}

/* BOTTOM DOCK (iOS STYLE) */
.dock {
  position: absolute;
  bottom: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 10px;
  background: #111;
  border-top: 1px solid #222;
}

.dock button {
  background: #222;
  border: none;
  color: white;
  padding: 10px;
  border-radius: 10px;
}

/* CARD */
.card {
  background: #1f1f1f;
  padding: 15px;
  border-radius: 12px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <button onclick="show('home')">🏠</button>
    <button onclick="show('apps')">📦</button>
    <button onclick="show('chat')">💬</button>
    <button onclick="show('profile')">👤</button>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <div id="home" class="screen active">
      <h1>Home</h1>
      <div class="card">Welcome to App OS</div>
    </div>

    <div id="apps" class="screen">
      <h1>Apps</h1>

      <div class="card">
        <button onclick="show('weatherApp')">Weather</button>
        <button onclick="show('notesApp')">Notes</button>
        <button onclick="show('games')">Games</button>
      </div>
    </div>

    <div id="weatherApp" class="screen">
      <h1>Weather</h1>
      <div class="card" id="weather">Loading...</div>
    </div>

    <div id="notesApp" class="screen">
      <h1>Notes</h1>

      <input id="noteInput" placeholder="New note">
      <button onclick="addNote()">Add</button>

      <div id="notes"></div>
    </div>

    <div id="chat" class="screen">
      <h1>Chat</h1>

      <div class="card">
        <div id="chatBox"></div>
        <input id="msg" placeholder="Message">
        <button onclick="send()">Send</button>
      </div>
    </div>

    <div id="games" class="screen">
      <h1>Games</h1>
      <div class="card">Mini games coming</div>
    </div>

    <div id="profile" class="screen">
      <h1>Profile</h1>
      <div class="card">User profile</div>
    </div>

  </div>
</div>

<script>

/* ROUTER */
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  location.hash = id;
}

/* INIT */
window.addEventListener('load', () => {
  const page = location.hash.replace('#','') || 'home';
  show(page);
  loadWeather();
  loadNotes();
});

/* WEATHER API */
async function loadWeather() {
  const el = document.getElementById("weather");
  const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=50.11&longitude=8.68&current_weather=true");
  const data = await res.json();
  el.innerText = `Temp: ${data.current_weather.temperature}°C`;
}

/* CHAT */
function send() {
  const msg = document.getElementById("msg");
  const box = document.getElementById("chatBox");

  const messages = JSON.parse(localStorage.getItem("chat") || "[]");
  messages.push(msg.value);
  localStorage.setItem("chat", JSON.stringify(messages));

  msg.value = "";
  loadChat();
}

function loadChat() {
  const box = document.getElementById("chatBox");
  const messages = JSON.parse(localStorage.getItem("chat") || "[]");
  box.innerHTML = messages.map(m => `<div>💬 ${m}</div>`).join("");
}
loadChat();

/* NOTES */
function addNote() {
  const input = document.getElementById("noteInput");
  const notes = JSON.parse(localStorage.getItem("notes") || "[]");
  notes.push(input.value);
  localStorage.setItem("notes", JSON.stringify(notes));
  input.value = "";
  loadNotes();
}

function loadNotes() {
  const box = document.getElementById("notes");
  const notes = JSON.parse(localStorage.getItem("notes") || "[]");
  box.innerHTML = notes.map(n => `<div class="card">📝 ${n}</div>`).join("");
}
</script>

</body>
</html>
