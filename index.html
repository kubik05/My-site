<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Web OS</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b12;
  color:white;
  overflow:hidden;
}

/* ===== HOME ===== */
#home{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  padding:15px;
}

.icon{
  background:rgba(255,255,255,0.08);
  border-radius:15px;
  padding:15px;
  text-align:center;
  cursor:pointer;
}

/* ===== WINDOW SYSTEM ===== */
.window{
  position:fixed;
  top:50px;
  left:5%;
  width:90%;
  height:80%;
  background:rgba(20,20,30,0.97);
  border-radius:15px;
  overflow:hidden;
  z-index:10;
}

.bar{
  display:flex;
  justify-content:space-between;
  padding:8px;
  background:rgba(255,255,255,0.1);
}

.content{
  height:100%;
  overflow:auto;
  padding:10px;
}

button{
  margin:3px;
  padding:8px;
  border:none;
  border-radius:6px;
}
</style>

</head>

<body>

<!-- ===== HOME ===== -->
<div id="home">

  <div class="icon" onclick="openChat()">💬<br>Чат</div>
  <div class="icon" onclick="openNotes()">📝<br>Заметки</div>
  <div class="icon" onclick="openGallery()">📷<br>Галерея</div>
  <div class="icon" onclick="openGames()">🎮<br>Игры</div>

</div>

<script>

/* =========================
   WINDOW CORE
========================= */

let z=10;

function openWindow(html){
  let w=document.createElement("div");
  w.className="window";
  w.style.zIndex=z++;

  w.innerHTML=`
    <div class="bar">
      <button onclick="this.parentElement.parentElement.remove()">❌</button>
      <span>APP</span>
    </div>
    <div class="content">${html}</div>
  `;

  document.body.appendChild(w);
}

/* =========================
   CHAT
========================= */

function openChat(){

let c=JSON.parse(localStorage.getItem("chat")||"[]");

openWindow(`
  <h3>💬 Чат</h3>
  <div id="chatBox"></div>
  <input id="msg">
  <button onclick="sendMsg()">Отправить</button>
`);

setTimeout(()=>{
  document.getElementById("chatBox").innerHTML=
    c.map(x=>"💬 "+x).join("<br>");
},100);

}

function sendMsg(){
  let m=document.getElementById("msg").value;
  let c=JSON.parse(localStorage.getItem("chat")||"[]");
  c.push(m);
  localStorage.setItem("chat",JSON.stringify(c));
}

/* =========================
   NOTES
========================= */

function openNotes(){

let n=localStorage.getItem("notes")||"";

openWindow(`
  <h3>📝 Заметки</h3>
  <textarea id="nt" style="width:100%;height:200px">${n}</textarea>
  <button onclick="saveNotes()">Сохранить</button>
`);

}

function saveNotes(){
  localStorage.setItem("notes",document.getElementById("nt").value);
}

/* =========================
   GALLERY
========================= */

function openGallery(){

openWindow(`
  <h3>📷 Галерея</h3>
  <input type="file" onchange="addImg(event)">
  <div id="gal"></div>
`);

setTimeout(()=>{
  let imgs=JSON.parse(localStorage.getItem("imgs")||"[]");
  document.getElementById("gal").innerHTML=
    imgs.map(i=>`<img src="${i}" style="width:100px;border-radius:10px">`).join("");
},100);

}

function addImg(e){
  let r=new FileReader();
  r.onload=function(){
    let imgs=JSON.parse(localStorage.getItem("imgs")||"[]");
    imgs.push(r.result);
    localStorage.setItem("imgs",JSON.stringify(imgs));
  };
  r.readAsDataURL(e.target.files[0]);
}

/* =========================
   GAMES (NO FARM)
========================= */

let score=0;

function openGames(){

openWindow(`
  <h3>🎮 Игры</h3>

  <button onclick="tap()">Тап игра</button>
  <div id="score">0</div>

  <button onclick="snake()">Змейка</button>
  <button onclick="memory()">Память</button>
`);

}

function tap(){
  score++;
  document.getElementById("score").innerText=score;

  let ctx=new AudioContext();
  let o=ctx.createOscillator();
  o.frequency.value=600;
  o.connect(ctx.destination);
  o.start();
  setTimeout(()=>o.stop(),80);

  if(navigator.vibrate) navigator.vibrate(40);
}

function snake(){
  openWindow("🐍 Змейка (будет доработана)");
}

function memory(){
  openWindow("🧠 Память (будет доработана)");
}

</script>

</body>
</html>
