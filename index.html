<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Android Mini OS</title>

<style>
/* ===== ОСНОВА ===== */
body{
  margin:0;
  font-family:Arial;
  background: radial-gradient(circle at top, #0b0b14, #05050a);
  color:white;
  overflow:hidden;
}

/* ===== СИСТЕМА ===== */
.app{
  display:flex;
  height:100vh;
}

/* ===== SIDEBAR ===== */
.sidebar{
  width:70px;
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(18px);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:10px;
}

.sidebar button{
  background:none;
  border:none;
  color:white;
  font-size:20px;
  padding:14px;
  cursor:pointer;
}

.sidebar button:hover{
  transform:scale(1.2);
  color:#6c7bff;
}

/* ===== AREA ===== */
.content{
  flex:1;
  position:relative;
}

/* ===== WINDOW ===== */
.window{
  position:absolute;
  width:320px;
  height:260px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);

  transform:scale(0.2);
  opacity:0;
  transition: transform 280ms cubic-bezier(0.2,0.9,0.2,1), opacity 200ms;
}

.window.open{
  transform:scale(1);
  opacity:1;
}

/* ===== TITLE BAR ===== */
.titlebar{
  background:rgba(0,0,0,0.4);
  padding:8px;
  display:flex;
  justify-content:space-between;
  cursor:grab;
  border-radius:18px 18px 0 0;
}

/* ===== CONTENT ===== */
.win-content{
  padding:10px;
}

/* ===== CLOSE ===== */
.close{
  cursor:pointer;
  color:#ff4d4d;
}

/* ===== INPUT ===== */
input{
  width:100%;
  margin-top:8px;
  padding:8px;
  background:#111;
  border:1px solid #333;
  color:white;
  border-radius:8px;
}

/* ===== BUTTON ===== */
button{
  margin-top:8px;
  padding:8px;
  background:linear-gradient(135deg,#5c6cff,#4fd1c5);
  border:none;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

/* ===== NOTIFICATION ===== */
#notif{
  position:absolute;
  top:20px;
  right:20px;
  padding:10px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  display:none;
}
</style>
</head>

<body>

<div id="notif">📢</div>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <button onclick="openApp('weather')">🌦</button>
    <button onclick="openApp('chat')">💬</button>
    <button onclick="openApp('notes')">📝</button>
    <button onclick="openApp('games')">🎮</button>
  </div>

  <div class="content"></div>

</div>

<script>

let z=1;

/* ===== УВЕДОМЛЕНИЯ ===== */
function notify(text){
  const n=document.getElementById("notif");
  n.innerText="📢 "+text;
  n.style.display="block";

  setTimeout(()=>{
    n.style.display="none";
  },2000);
}

/* ===== ЗВУК ===== */
function sound(){
  try{
    let a=new Audio("https://actions.google.com/sounds/v1/ui/click.ogg");
    a.play();
  }catch(e){}
}

/* ===== ВИБРАЦИЯ ===== */
function vib(){
  if(navigator.vibrate){
    navigator.vibrate(30);
  }
}

/* ===== OPEN APP ===== */
function openApp(type){

  sound();
  vib();
  notify("Открыто: "+type);

  const w=document.createElement("div");
  w.className="window";

  w.style.top="50%";
  w.style.left="50%";
  w.style.transformOrigin="center";
  w.style.zIndex=z++;

  let content="";

  if(type==="weather"){
    content="🌦 Loading...";
    loadWeather(w);
  }

  if(type==="chat"){
    content=`
      💬 Chat
      <div id="chatBox"></div>
      <input id="msg">
      <button onclick="send()">Send</button>
    `;
  }

  if(type==="notes"){
    content=`
      📝 Notes
      <input id="note">
      <button onclick="addNote()">Add</button>
      <div id="notesBox"></div>
    `;
  }

  if(type==="games"){
    content="🎮 Games";
  }

  w.innerHTML=`
    <div class="titlebar">
      <span>${type}</span>
      <span class="close" onclick="closeWin(this)">✕</span>
    </div>
    <div class="win-content">${content}</div>
  `;

  document.body.appendChild(w);

  requestAnimationFrame(()=>{
    w.classList.add("open");
  });

  drag(w);
}

/* ===== CLOSE ===== */
function closeWin(el){
  const w=el.parentElement.parentElement;
  w.classList.remove("open");
  setTimeout(()=>w.remove(),200);
}

/* ===== DRAG ===== */
function drag(el){
  let dx,dy,drag=false;

  el.querySelector(".titlebar").onmousedown=(e)=>{
    drag=true;
    dx=e.clientX-el.offsetLeft;
    dy=e.clientY-el.offsetTop;
  };

  document.onmousemove=(e)=>{
    if(drag){
      el.style.left=(e.clientX-dx)+"px";
      el.style.top=(e.clientY-dy)+"px";
    }
  };

  document.onmouseup=()=>drag=false;
}

/* ===== WEATHER ===== */
async function loadWeather(win){
  const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=50.11&longitude=8.68&current_weather=true");
  const d=await r.json();
  win.querySelector(".win-content").innerHTML="🌦 "+d.current_weather.temperature+"°C";
}

/* ===== CHAT ===== */
function send(){
  let m=document.getElementById("msg");
  if(!m) return;

  let c=JSON.parse(localStorage.getItem("chat")||"[]");
  c.push(m.value);
  localStorage.setItem("chat",JSON.stringify(c));
  m.value="";
}

/* ===== NOTES ===== */
function addNote(){
  let n=document.getElementById("note");
  if(!n) return;

  let a=JSON.parse(localStorage.getItem("notes")||"[]");
  a.push(n.value);
  localStorage.setItem("notes",JSON.stringify(a));
  n.value="";
}

</script>

</body>
</html>
