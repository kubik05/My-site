<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Mobile Web OS</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#0b0b12;
  color:white;
  overflow:hidden;
}

/* HOME */

#home{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  padding:15px;
}

.icon{
  background:rgba(255,255,255,0.08);
  border-radius:18px;
  padding:20px 10px;
  text-align:center;
  font-size:14px;
  cursor:pointer;
  user-select:none;
}

/* APP */

#app{
  position:fixed;
  inset:0;
  background:#0f0f18;
  display:none;
  flex-direction:column;
}

.topbar{
  height:50px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  background:rgba(255,255,255,0.08);
}

.back{
  background:none;
  border:none;
  color:white;
  font-size:20px;
}

.content{
  flex:1;
  overflow:hidden;
}

/* IFRAME */

iframe{
  width:100%;
  height:100%;
  border:none;
}

</style>

</head>

<body>

<!-- HOME -->

<div id="home">

  <div class="icon" onclick="openChat()">
    💬<br>Чат
  </div>

  <div class="icon" onclick="openNotes()">
    📝<br>Заметки
  </div>

  <div class="icon" onclick="openGallery()">
    📷<br>Галерея
  </div>

  <div class="icon" onclick="openGames()">
    🎮<br>Игры
  </div>

  <div class="icon" onclick="openFarm()">
    🌾<br>Ферма
  </div>

</div>

<!-- APP -->

<div id="app">

  <div class="topbar">

    <button class="back" onclick="closeApp()">
      ←
    </button>

    <span id="title">
      App
    </span>

    <div></div>

  </div>

  <div class="content" id="content"></div>

</div>

<script>

/* OPEN APP */

function openApp(title,html){

  document.getElementById("home").style.display="none";

  document.getElementById("app").style.display="flex";

  document.getElementById("title").innerText=title;

  document.getElementById("content").innerHTML=html;

}

/* CLOSE */

function closeApp(){

  document.getElementById("home").style.display="grid";

  document.getElementById("app").style.display="none";

}

/* APPS */

function openChat(){

  openApp("💬 Чат",`

    <div style="
      padding:20px;
      color:white;
    ">
      Чат скоро будет
    </div>

  `);

}

function openNotes(){

  openApp("📝 Заметки",`

    <textarea style="
      width:100%;
      height:100%;
      background:#111;
      color:white;
      border:none;
      padding:20px;
      font-size:18px;
    "></textarea>

  `);

}

function openGallery(){

  openApp("📷 Галерея",`

    <div style="
      padding:20px;
      color:white;
    ">
      Галерея скоро будет
    </div>

  `);

}

function openGames(){

  openApp("🎮 Игры",`

    <div style="
      padding:20px;
      color:white;
    ">
      Игры скоро будут
    </div>

  `);

}

/* FARM */

function openFarm(){

  openApp("🌾 Ферма",`

    <iframe src="farm-game/index.html"></iframe>

  `);

}

</script>

</body>
</html>
