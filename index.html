<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Farm Game PRO</title>

<style>

/* ======================
   BODY
====================== */

body{

  margin:0;

  overflow:hidden;

  background:#071b11;

  font-family:Arial,sans-serif;

  color:white;

}

/* ======================
   CANVAS
====================== */

#game{

  position:fixed;

  inset:0;

  width:100%;

  height:100%;

  touch-action:none;

}

/* ======================
   TOP UI
====================== */

#topUI{

  position:fixed;

  top:10px;

  left:10px;

  right:10px;

  z-index:10;

  display:flex;

  flex-direction:column;

  gap:10px;

}

/* ======================
   INFO BAR
====================== */

#info{

  background:rgba(0,0,0,0.45);

  backdrop-filter:blur(8px);

  padding:12px;

  border-radius:14px;

  font-size:24px;

}

/* ======================
   XP BAR
====================== */

#xpContainer{

  width:100%;

  height:18px;

  background:#2a2a2a;

  border-radius:20px;

  overflow:hidden;

}

#xpBar{

  width:0%;

  height:100%;

  background:linear-gradient(
    90deg,
    gold,
    orange
  );

}

/* ======================
   BOTTOM MENU
====================== */

#menu{

  position:fixed;

  left:0;

  right:0;

  bottom:20px;

  display:flex;

  justify-content:center;

  gap:25px;

  z-index:10;

}

/* ======================
   BUTTONS
====================== */

.cropBtn{

  width:72px;

  height:72px;

  border:none;

  border-radius:22px;

  background:rgba(255,255,255,0.95);

  font-size:38px;

  box-shadow:0 4px 15px rgba(0,0,0,0.35);

}

/* ======================
   ACTIVE BUTTON
====================== */

.active{

  outline:4px solid gold;

  transform:scale(1.08);

}

</style>

</head>

<body>

<!-- ======================
     UI
====================== -->

<div id="topUI">

  <div id="info">
    💰 <span id="money">500</span>
    |
    ⭐ LVL <span id="level">1</span>
  </div>

  <div id="xpContainer">
    <div id="xpBar"></div>
  </div>

</div>

<!-- ======================
     MENU
====================== -->

<div id="menu">

  <button
  class="cropBtn active"
  id="btn_wheat"
  onclick="selectCrop('wheat')">
  🌾
  </button>

  <button
  class="cropBtn"
  id="btn_carrot"
  onclick="selectCrop('carrot')">
  🥕
  </button>

  <button
  class="cropBtn"
  id="btn_berry"
  onclick="selectCrop('berry')">
  🍓
  </button>

</div>

<!-- ======================
     GAME
====================== -->

<canvas id="game"></canvas>

<!-- ======================
     SCRIPT
====================== -->

<script src="game.js"></script>

<script>

/* ======================
   BUTTON ACTIVE UI
====================== */

function setActive(id){

  document
  .querySelectorAll(".cropBtn")
  .forEach(b=>b.classList.remove("active"));

  document
  .getElementById(id)
  .classList.add("active");

}

/* ======================
   SELECT CROP
====================== */

function selectCrop(name){

  selected = name;

  if(name==="wheat"){
    setActive("btn_wheat");
  }

  if(name==="carrot"){
    setActive("btn_carrot");
  }

  if(name==="berry"){
    setActive("btn_berry");
  }

}

</script>

</body>
</html>
