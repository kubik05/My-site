<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
    }

    nav {
      display: flex;
      gap: 10px;
      padding: 10px;
      background: #222;
    }

    nav button {
      color: white;
      background: #444;
      border: none;
      padding: 10px;
      cursor: pointer;
    }

    nav button:hover {
      background: #666;
    }

    .screen {
      display: none;
      padding: 20px;
    }

    .screen.active {
      display: block;
    }
  </style>
</head>

<body>

  <!-- НАВИГАЦИЯ -->
  <nav>
    <button onclick="show('home')">Home</button>
    <button onclick="show('games')">Games</button>
    <button onclick="show('tools')">Tools</button>
    <button onclick="show('profile')">Profile</button>
  </nav>

  <!-- ЭКРАНЫ -->
  <div id="home" class="screen active">
    <h1>🏠 Home</h1>
    <p>Главная страница</p>
  </div>

  <div id="games" class="screen">
    <h1>🎮 Games</h1>
    <p>Раздел игр</p>
  </div>

  <div id="tools" class="screen">
    <h1>🛠 Tools</h1>
    <p>Раздел инструментов</p>
  </div>

  <div id="profile" class="screen">
    <h1>👤 Profile</h1>
    <p>Твой профиль</p>
  </div>

  <!-- JS ЛОГИКА -->
  <script>
    function show(id) {
      document.querySelectorAll('.screen').forEach(s => {
        s.classList.remove('active');
      });

      document.getElementById(id).classList.add('active');

      // сохраняем состояние в URL
      location.hash = id;
    }

    // запуск при загрузке
    window.addEventListener('load', () => {
      const page = location.hash.replace('#', '') || 'home';
      show(page);
    });
  </script>

</body>
</html>
