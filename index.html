<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kubik App</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    padding: 15px;
    background: #111827;
}

nav button {
    background: none;
    border: none;
    color: white;
    margin: 0 5px;
    cursor: pointer;
    font-size: 16px;
}

/* SCREENS */
.screen {
    display: none;
    padding: 20px;
}

.active {
    display: block;
}

/* CARD */
.card {
    background: #1f2937;
    padding: 15px;
    border-radius: 10px;
    margin: 10px 0;
}
</style>
</head>

<body>

<header>
<h2>🔥 KUBIK APP</h2>

<nav>
<button onclick="show('home')">🏠</button>
<button onclick="show('games')">🎮</button>
<button onclick="show('tools')">🛠</button>
<button onclick="show('ai')">🤖</button>
</nav>
</header>

<!-- HOME -->
<div id="home" class="screen active">
<h2>Главная</h2>
<div class="card">Добро пожаловать в приложение 🚀</div>
</div>

<!-- GAMES -->
<div id="games" class="screen">
<h2>Игры</h2>
<div class="card">🎮 Ферма</div>
<div class="card">🐍 Змейка</div>
<div class="card">🧠 Кликер</div>
</div>

<!-- TOOLS -->
<div id="tools" class="screen">
<h2>Инструменты</h2>
<div class="card">🌤 Погода</div>
<div class="card">📝 Заметки</div>
<div class="card">🔐 Генератор паролей</div>
</div>

<!-- AI -->
<div id="ai" class="screen">
<h2>AI Чат</h2>
<div class="card">🤖 Тут будет твой AI чат</div>
</div>

<script>
function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}
</script>

</body>
</html>
