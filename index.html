<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Web OS</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b12;
  color:white;
  overflow:hidden;
}

/* ===== HOME SCREEN ===== */
#home{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  padding:15px;
}

.icon{
  background:rgba(255,255,255,0.08);
  border-radius:15px;
  padding:15px;
  text-align:center;
  cursor:pointer;
}

/* ===== WINDOW SYSTEM ===== */
.window{
  position:fixed;
  top:50px;
  left:5%;
  width:90%;
  height:80%;
  background:rgba(20,20,30,0.97);
  border-radius:15px;
  overflow:hidden;
  z-index:10;
}

.bar{
  display:flex;
  justify-content:space-between;
  padding:8px;
  background:rgba(255,255,255,0.1);
}

.content{
  width:100%;
  height:100%;
  overflow:hidden;
}

button{
  margin:3px;
  padding:8px;
  border:none;
  border-radius:6px;
}
</style>

</head>

<body>

<!-- ===== ICONS ===== -->
<div id="home">

  <div class="icon" onclick="openChat()">💬<br>Чат</div>
  <div class="icon" onclick="openNotes()">📝<br>Заметки</div>
  <div class="icon" onclick="openGallery()">📷<br>Галерея</div>
  <div class="icon" onclick="openGames()">🎮<br>Игры</div>

  <!-- 🌾 FARM -->
  <div class="icon" onclick="openFarm()">🌾<br>Ферма</div>

</div>

<script>

/* =========================
   WINDOW CORE (НЕ ТРОГАЕМ ЛОГИКУ)
========================= */

let z=10;

function openWindow(html){
  let w=document.createElement("div");
  w.className="window";
  w.style.zIndex=z++;

  w.innerHTML=`
    <div class="bar">
      <button onclick="this.parentElement.parentElement.remove()">❌</button>
      <span>APP</span>
    </div>
    <div class="content">${html}</div>
  `;

  document.body.appendChild(w);
}

/* =========================
   CHAT
========================= */

function openChat(){
  openWindow(`
    <h3>💬 Чат</h3>
    <input style="width:100%">
    <button>Отправить</button>
  `);
}

/* =========================
   NOTES
========================= */

function openNotes(){
  openWindow(`
    <h3>📝 Заметки</h3>
    <textarea style="width:100%;height:200px"></textarea>
  `);
}

/* =========================
   GALLERY
========================= */

function openGallery(){
  openWindow(`
    <h3>📷 Галерея</h3>
    <input type="file">
  `);
}

/* =========================
   GAMES
========================= */

function openGames(){
  openWindow(`
    <h3>🎮 Игры</h3>
    <p>Игры будут здесь</p>
  `);
}

/* =========================
   🌾 FARM LAUNCH (ЕДИНСТВЕННОЕ ДОБАВЛЕНИЕ)
========================= */

function openFarm(){
  openWindow(`
    <iframe src="farm.html"
    style="width:100%;height:100%;border:none"></iframe>
  `);
}

</script>

</body>
</html>
