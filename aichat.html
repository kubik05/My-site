<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Простой AI чат</title>
<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
    display: flex;
    flex-direction: column;
    height: 100vh;
    align-items: center;
}

h2 {
    margin: 15px;
}

#chat {
    flex: 1;
    width: 90%;
    max-width: 600px;
    overflow-y: auto;
    padding: 10px;
}

.msg {
    margin: 8px 0;
    padding: 10px;
    border-radius: 10px;
}

.user {
    background: #2563eb;
    align-self: flex-end;
}

.ai {
    background: #334155;
}

.input-box {
    display: flex;
    width: 90%;
    max-width: 600px;
    margin: 10px;
}

input {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 10px;
}

button {
    margin-left: 10px;
    padding: 10px;
    border: none;
    background: #22c55e;
    color: white;
    border-radius: 10px;
    cursor: pointer;
}
</style>
</head>
<body>

<h2>🤖 Простой AI чат</h2>

<div id="chat"></div>

<div class="input-box">
    <input id="input" placeholder="Напиши сообщение...">
    <button onclick="send()">➤</button>
</div>

<script>
const chat = document.getElementById("chat");

// база "интеллекта"
function getReply(text) {
    text = text.toLowerCase();

    if (text.includes("привет")) return "Привет 👋";
    if (text.includes("как дела")) return "Я работаю нормально 🤖";
    if (text.includes("кто ты")) return "Я простой AI бот, созданный для твоего сайта";
    if (text.includes("погода")) return "У тебя есть отдельная страница погоды 🌤️";
    if (text.includes("пока")) return "Пока! 👋";

    return "Я пока не понимаю это 😅";
}

function addMsg(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function send() {
    const input = document.getElementById("input");
    const text = input.value.trim();
    if (!text) return;

    addMsg(text, "user");
    input.value = "";

    setTimeout(() => {
        const reply = getReply(text);
        addMsg(reply, "ai");
    }, 500);
}
</script>

</body>
</html>
