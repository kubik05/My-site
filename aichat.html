<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Чат</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        .msg {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 15px;
            margin: 5px 0;
        }
        .user { background: #4CAF50; }
        .bot { background: #2196F3; }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 20px;
            border: none;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 12px 20px;
            cursor: pointer;
        }
        .back-link {
            margin-top: 20px;
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
            width: fit-content;
        }
    </style>
</head>
<body>
    <h1>🤖 AI Чат</h1>
    <div class="chat-container" id="chat"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Спроси что-нибудь...">
        <button onclick="sendMessage()">→</button>
    </div>
    <a href="index.html" class="back-link">← На главную</a>

    <script>
        const API_KEY = "AIzaSyAjyc2cSvA4yboB87q24NrOlt7XfzcapAM"; // ← ВСТАВЬ СВОЙ КЛЮЧ
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;
            addMessage('Вы', message, 'user');
            input.value = '';
            const reply = await askGemini(message);
            addMessage('Бот', reply, 'bot');
        }
        async function askGemini(prompt) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-latest:generateContent?key=${API_KEY}`;
            const headers = {'Content-Type': 'application/json'};
            const data = {"contents":[{"parts":[{"text": prompt}]}]};
            try {
                const resp = await fetch(url, {method:'POST', headers, body:JSON.stringify(data)});
                const json = await resp.json();
                return json.candidates[0].content.parts[0].text;
            } catch(e) {
                return "Ошибка: " + e.message;
            }
        }
        function addMessage(sender, text, cls) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `msg ${cls}`;
            div.innerHTML = `<strong>${sender}:</strong> ${text}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
