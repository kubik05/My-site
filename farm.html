<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Farm PRO FINAL</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0e1a12;
  color:white;
}

#top{
  padding:10px;
  background:#111;
  font-size:12px;
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
}

#grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  padding:10px;
}

.cell{
  background:#1c3a2a;
  height:80px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:0.2s;
}

.cell:active{
  transform:scale(0.95);
}

.panel{
  padding:10px;
  background:#0b0b0b;
  font-size:13px;
}

button{
  margin:3px;
  padding:8px;
  border:none;
  border-radius:6px;
}
</style>

</head>

<body>

<div id="top">
🌾 Lvl: <span id="lvl">1</span> |
⚡ Energy: <span id="energy">10</span> |
💰 <span id="money">100</span> |
📦 Inv: <span id="inv">0</span> |
🌍 <span id="market">stable</span>
</div>

<div class="panel" id="quests"></div>
<div class="panel" id="buildings"></div>

<div id="grid"></div>

<script>

/* ======================
   SAVE
====================== */

let save = JSON.parse(localStorage.getItem("farm_final")||"{}");

let money = save.money ?? 100;
let level = save.level ?? 1;
let energy = save.energy ?? 10;

let inventory = save.inventory ?? 0;

let barn = save.barn ?? 0;

/* ======================
   MARKET
====================== */

let market = {
  wheat:10,
  carrot:18,
  berry:28,
  melon:45
};

function marketUpdate(){

  for(let k in market){
    market[k] += Math.random()*4 - 2;
    if(market[k]<5) market[k]=5;
  }

  let avg = Object.values(market).reduce((a,b)=>a+b)/4;

  document.getElementById("market").innerText =
    avg>30?"🔥 hot":avg<15?"❄️ cold":"stable";
}

setInterval(marketUpdate,4000);

/* ======================
   NPC SYSTEM
====================== */

function npc(){
  return 0.9 + Math.random()*0.4;
}

/* ======================
   CROPS
====================== */

let crops = {
  wheat:{time:3},
  carrot:{time:5},
  berry:{time:6},
  melon:{time:8}
};

let selected="wheat";

/* ======================
   GRID
====================== */

let grid=document.getElementById("grid");
let cells=[];

for(let i=0;i<12;i++){
  let d=document.createElement("div");
  d.className="cell";
  d.innerHTML="🌱";
  d.onclick=()=>plant(i);
  grid.appendChild(d);

  cells[i]={crop:null,time:0,timer:null};
}

/* ======================
   ENERGY
====================== */

setInterval(()=>{
  if(energy<10+barn) energy++;
},3000);

/* ======================
   PLANT
====================== */

function plant(i){

  if(energy<=0) return;

  let c=cells[i];
  if(c.crop) return;

  c.crop=selected;
  c.time=crops[selected].time;

  energy--;

  let el=document.getElementsByClassName("cell")[i];
  el.innerHTML="🌱";

  c.timer=setInterval(()=>{

    c.time--;

    if(c.time<=0){
      clearInterval(c.timer);
      el.innerHTML="✔";
      el.onclick=()=>harvest(i);
    }

  },1000);
}

/* ======================
   HARVEST
====================== */

function harvest(i){

  if(inventory >= 10 + barn*5){
    alert("📦 склад переполнен!");
    return;
  }

  let c=cells[i];

  let base = market[c.crop];
  let reward = base * npc();

  money += reward;
  inventory++;

  c.crop=null;

  let el=document.getElementsByClassName("cell")[i];
  el.innerHTML="🌱";
  el.onclick=()=>plant(i);

  checkLevel();
  quests();
  update();
}

/* ======================
   LEVEL
====================== */

function checkLevel(){
  if(money > level*150){
    level++;
  }
}

/* ======================
   QUESTS
====================== */

let questStep=0;

function quests(){

  let q=document.getElementById("quests");

  if(questStep===0){
    q.innerHTML="🎯 заработай 300$";

    if(money>300){
      money+=50;
      questStep++;
    }
  }

  else if(questStep===1){
    q.innerHTML="🎯 прокачай lvl 3";

    if(level>=3){
      money+=100;
      questStep++;
    }
  }

  else{
    q.innerHTML="🏆 все квесты завершены";
  }
}

/* ======================
   BUILDINGS
====================== */

document.getElementById("buildings").innerHTML=`
🏠 здания:
<button onclick="barn++">🏠 barn (${barn})</button>
<button onclick="saveGame()">💾 save</button>
`;

function saveGame(){
  localStorage.setItem("farm_final",JSON.stringify({
    money,level,energy,inventory,barn
  }));

  alert("💾 сохранено");
}

/* ======================
   UPDATE
====================== */

function update(){
  document.getElementById("money").innerText=Math.floor(money);
  document.getElementById("lvl").innerText=level;
  document.getElementById("energy").innerText=energy;
  document.getElementById("inv").innerText=inventory;
}

update();
quests();

</script>

</body>
</html>
