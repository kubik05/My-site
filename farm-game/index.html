<title>Farm Game PRO</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="ui">

  ⭐ LVL <span id="level">1</span>
</div>

<!-- XP BAR -->
<div id="xpContainer">

</div>

</div>

<!-- GAME -->
<canvas id="game"></canvas>

<!-- SCRIPTS -->
<script src="world.js"></script>

<script>

/* ======================
   SELECT CROP
====================== */

function selectCrop(name){
  selected = name;
}

</script>
