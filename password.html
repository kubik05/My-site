<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор паролей</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { margin-bottom: 20px; }
        .container {
            width: 90%;
            max-width: 400px;
        }
        .result {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 15px;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
            word-break: break-all;
            cursor: pointer;
        }
        label {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
        }
        input[type="range"] {
            width: 100%;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-size: 1.2rem;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        .back-link {
            margin-top: 30px;
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <h1>🔐 Генератор паролей</h1>
    <div class="container">
        <div class="result" id="password" onclick="copyPassword()">Нажми "Сгенерировать"</div>
        <label>
            <span>Длина: <span id="lengthValue">12</span></span>
            <input type="range" id="length" min="4" max="32" value="12" oninput="document.getElementById('lengthValue').textContent=this.value">
        </label>
        <label>
            <span>Цифры</span>
            <input type="checkbox" id="includeDigits" checked>
        </label>
        <label>
            <span>Символы (!@#$)</span>
            <input type="checkbox" id="includeSymbols" checked>
        </label>
        <label>
            <span>Заглавные буквы</span>
            <input type="checkbox" id="includeUpper" checked>
        </label>
        <button onclick="generatePassword()">Сгенерировать</button>
    </div>
    <a href="index.html" class="back-link">← На главную</a>

    <script>
        function generatePassword() {
            const length = parseInt(document.getElementById('length').value);
            const useDigits = document.getElementById('includeDigits').checked;
            const useSymbols = document.getElementById('includeSymbols').checked;
            const useUpper = document.getElementById('includeUpper').checked;

            let charset = 'abcdefghijklmnopqrstuvwxyz';
            if (useUpper) charset += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (useDigits) charset += '0123456789';
            if (useSymbols) charset += '!@#$%^&*()_+-=[]{}|;:,.<>?';

            let password = '';
            for (let i = 0; i < length; i++) {
                password += charset.charAt(Math.floor(Math.random() * charset.length));
            }
            document.getElementById('password').textContent = password;
        }

        function copyPassword() {
            const text = document.getElementById('password').textContent;
            if (!text || text === 'Нажми "Сгенерировать"') return;
            navigator.clipboard.writeText(text).then(() => {
                alert('Пароль скопирован!');
            });
        }
    </script>
</body>
</html>
